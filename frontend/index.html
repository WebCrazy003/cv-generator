<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CV Generator</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 2rem; background: #f5f6f8; color: #1f2937; }
      .card { background: white; border-radius: 12px; padding: 1.5rem; box-shadow: 0 6px 18px rgba(0,0,0,0.08); max-width: 980px; margin: 0 auto; }
      textarea { width: 100%; min-height: 240px; padding: 0.8rem; border-radius: 8px; border: 1px solid #d1d5db; font-family: monospace; }
      input[type="text"] { width: 100%; padding: 0.7rem; border-radius: 8px; border: 1px solid #d1d5db; }
      button { padding: 0.7rem 1rem; border: none; border-radius: 8px; background: #2563eb; color: white; cursor: pointer; }
      button.secondary { background: #e5e7eb; color: #111827; }
      .row { display: flex; gap: 0.75rem; margin-top: 0.75rem; }
      .pill { display: inline-block; padding: 0.35rem 0.6rem; border-radius: 999px; background: #dbeafe; margin-right: 0.4rem; margin-top: 0.4rem; }
      .status { margin-top: 0.75rem; font-weight: 600; }
      .status.success { color: #047857; }
      .status.error { color: #b91c1c; }
      .list { margin-top: 0.5rem; }
      .item { display: flex; align-items: center; justify-content: space-between; padding: 0.6rem 0.7rem; background: #f9fafb; border-radius: 8px; margin-top: 0.4rem; }
      .item.active { border: 1px solid #2563eb; background: #eff6ff; }
      .muted { color: #6b7280; font-size: 0.95rem; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel" src="./app.js"></script>
  </body>
</html>
